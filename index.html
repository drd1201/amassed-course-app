<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AMASSED | Leadership Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* ── Tokens ──────────────────────────────────────────────── */
:root {
  --gold:       #9a6f20;
  --gold-light: #7a5210;
  --gold-dark:  #b8860b;
  --bg:         #f7f4ef;
  --bg2:        #ffffff;
  --bg3:        #edeae3;
  --border:     rgba(154,111,32,.2);
  --text:       #2c2416;
  --muted:      #8a7a60;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  height: 100%;
  font-family: 'Cormorant Garamond', Georgia, serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ════════════════════════════════════════════════════════════
   DESKTOP  (≥ 701px)
════════════════════════════════════════════════════════════ */
@media (min-width: 701px) {
  #player-bar {
    height: 110px; min-height: 110px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 20px;
    padding: 0 28px; z-index: 100; position: relative; flex-shrink: 0;
  }
  #player-bar::after {
    content: ''; position: absolute;
    bottom: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: .5;
  }
  #mobile-header, #mobile-player { display: none; }
  #sidebar-toggle { display: none; }
  .corner-deco { display: block; }
  #sidebar {
    width: 280px; min-width: 280px;
    background: var(--bg2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden; position: relative;
  }
  #sidebar::after {
    content: ''; position: absolute;
    top: 0; right: 0; bottom: 0; width: 1px;
    background: linear-gradient(180deg, transparent, var(--gold) 40%, var(--gold) 60%, transparent); opacity: .35;
  }
  #sidebar-overlay { display: none; }
  #main { display: flex; flex: 1; overflow: hidden; }
  #reader { flex: 1; overflow-y: auto; padding: 40px 56px; background: var(--bg); }
  .logo-mark { display: block; }
  .player-center { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
  #now-playing {
    font-family: 'Josefin Sans', sans-serif; font-size: .68rem;
    letter-spacing: .2em; color: var(--muted); text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #now-playing span { color: var(--gold-light); }
  .player-controls { display: flex; align-items: center; gap: 12px; }
  .ctrl-btn {
    background: none; border: 1px solid var(--border); color: var(--text);
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: .9rem;
    display: flex; align-items: center; justify-content: center; transition: all .2s; flex-shrink: 0;
  }
  .ctrl-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,.08); }
  #play-btn {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    border: none; color: #000; font-size: 1rem;
  }
  #play-btn:hover { filter: brightness(1.15); color: #000; }
  .progress-wrap { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .time-label {
    font-family: 'Josefin Sans', sans-serif; font-size: .65rem; color: var(--muted);
    white-space: nowrap; width: 38px; text-align: center;
  }
  #progress-desk {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 3px; background: var(--bg3); border-radius: 2px; cursor: pointer; outline: none;
  }
  #progress-desk::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: var(--gold); cursor: pointer; box-shadow: 0 0 8px rgba(201,168,76,.5);
  }
  .volume-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .vol-icon { color: var(--muted); font-size: .85rem; }
  #volume {
    -webkit-appearance: none; appearance: none;
    width: 72px; height: 3px; background: var(--bg3); border-radius: 2px; cursor: pointer; outline: none;
  }
  #volume::-webkit-slider-thumb {
    -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: var(--gold); cursor: pointer;
  }
  #sidebar-close { display: none !important; }
  #reader-content h1 { font-size: 2.4rem; font-weight: 300; color: var(--gold-dark); margin-bottom: 6px; line-height: 1.2; }
  #reader-content h2 { font-size: 1.7rem; font-weight: 300; color: var(--gold); margin: 2em 0 .6em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  #reader-content p  { font-size: 1.1rem; line-height: 1.85; color: var(--text); margin-bottom: 1.2em; font-weight: 300; }
}

/* ════════════════════════════════════════════════════════════
   MOBILE  (≤ 700px)
════════════════════════════════════════════════════════════ */
@media (max-width: 700px) {
  #player-bar { display: none; }
  .corner-deco { display: none; }

  /* Top header */
  #mobile-header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px 12px;
    background: var(--bg2); border-bottom: 1px solid var(--border);
    flex-shrink: 0; position: relative; z-index: 10;
  }
  #mobile-header::after {
    content: ''; position: absolute;
    bottom: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: .5;
  }
  #sidebar-toggle {
    display: flex; align-items: center; justify-content: center;
    width: 46px; height: 46px;
    background: none; border: 1px solid var(--border); border-radius: 8px;
    color: var(--gold); font-size: 1.3rem; cursor: pointer; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .mobile-now-playing { flex: 1; min-width: 0; }
  .mobile-now-playing .label {
    font-family: 'Josefin Sans', sans-serif; font-size: .6rem;
    letter-spacing: .2em; color: var(--muted); text-transform: uppercase;
    display: block; margin-bottom: 4px;
  }
  .mobile-now-playing .track-name {
    font-size: 1.05rem; font-weight: 400; color: var(--gold-light);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; line-height: 1.3;
  }
  .mobile-logo {
    font-family: 'Josefin Sans', sans-serif; font-size: .58rem; font-weight: 600;
    letter-spacing: .28em; color: var(--gold); text-transform: uppercase;
    line-height: 1.4; text-align: right; flex-shrink: 0;
  }

  /* Main fills between header and player */
  #main { display: flex; flex: 1; overflow: hidden; position: relative; }
  #reader {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 24px 20px; background: var(--bg); width: 100%;
  }

  /* Bottom player */
  #mobile-player {
    display: flex; flex-direction: column; gap: 0;
    background: var(--bg2); border-top: 1px solid var(--border);
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
    flex-shrink: 0; position: relative; z-index: 10;
  }
  #mobile-player::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: .5;
  }
  .mob-progress-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  }
  .mob-time {
    font-family: 'Josefin Sans', sans-serif; font-size: .72rem; color: var(--muted);
    white-space: nowrap; width: 38px; text-align: center; flex-shrink: 0;
  }
  #progress-mob {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 4px; border-radius: 2px; background: var(--bg3); cursor: pointer; outline: none;
  }
  #progress-mob::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
    background: var(--gold); cursor: pointer; box-shadow: 0 0 10px rgba(154,111,32,.4);
  }
  #progress-mob::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%; background: var(--gold); border: none;
  }
  .mob-controls-row {
    display: flex; align-items: center; justify-content: center; gap: 24px;
  }
  .ctrl-btn {
    background: none; border: 1px solid var(--border); color: var(--text);
    width: 50px; height: 50px; border-radius: 50%; cursor: pointer; font-size: 1.05rem;
    display: flex; align-items: center; justify-content: center; transition: all .15s;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation; flex-shrink: 0;
  }
  .ctrl-btn:active { border-color: var(--gold); color: var(--gold); background: rgba(154,111,32,.1); }
  #play-btn {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    border: none; color: #fff; font-size: 1.4rem;
    box-shadow: 0 4px 18px rgba(154,111,32,.35);
  }
  #play-btn:active { filter: brightness(1.1); color: #fff; }

  /* Sidebar drawer */
  #sidebar-overlay {
    display: block; position: fixed; inset: 0;
    background: rgba(0,0,0,.45); z-index: 200;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  #sidebar-overlay.visible { opacity: 1; pointer-events: all; }
  #sidebar {
    position: fixed; left: 0; top: 0; bottom: 0;
    width: min(300px, 88vw);
    background: var(--bg2); z-index: 210;
    display: flex; flex-direction: column; overflow: hidden;
    transform: translateX(-100%);
    transition: transform .28s cubic-bezier(.4,0,.2,1);
    box-shadow: 4px 0 24px rgba(0,0,0,.2);
  }
  #sidebar.open { transform: translateX(0); }
  #sidebar-close { display: flex !important; }

  /* Bigger reader text on mobile */
  #reader-content h1 { font-size: 2rem; font-weight: 400; color: var(--gold-dark); margin-bottom: 8px; line-height: 1.2; }
  #reader-content h2 { font-size: 1.5rem; font-weight: 300; color: var(--gold); margin: 1.8em 0 .5em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  #reader-content p  { font-size: 1.15rem; line-height: 1.9; color: var(--text); margin-bottom: 1.3em; font-weight: 300; }
  .section-title { font-size: 1.5rem !important; }
  .section-block.active-section { padding-left: 14px; margin-left: -14px; }
}

/* ════════════════════════════════════════════════════════════
   SHARED SIDEBAR STYLES
════════════════════════════════════════════════════════════ */
.sidebar-head {
  padding: 20px 20px 14px; border-bottom: 1px solid var(--border);
  flex-shrink: 0; display: flex; align-items: flex-start; gap: 10px;
}
.sidebar-head-text { flex: 1; }
.sidebar-head h2 {
  font-family: 'Josefin Sans', sans-serif; font-size: .65rem;
  letter-spacing: .3em; color: var(--gold); text-transform: uppercase; margin-bottom: 4px;
}
.sidebar-head p { font-size: .9rem; color: var(--muted); font-style: italic; }
#sidebar-close {
  display: none; background: none; border: none; color: var(--muted);
  font-size: 1.3rem; cursor: pointer; padding: 0 4px; flex-shrink: 0;
  align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
#track-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 0; }
#track-list::-webkit-scrollbar { width: 4px; }
#track-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.chapter-label {
  font-family: 'Josefin Sans', sans-serif; font-size: .62rem;
  letter-spacing: .28em; color: var(--gold-dark); text-transform: uppercase;
  padding: 14px 20px 5px; display: flex; align-items: center; gap: 8px;
  cursor: pointer; user-select: none; transition: color .2s;
  -webkit-tap-highlight-color: transparent;
}
.chapter-label:hover { color: var(--gold); }
.chapter-label .ch-num {
  width: 20px; height: 20px; border: 1px solid currentColor; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: .58rem; flex-shrink: 0;
}
.chapter-label .ch-arrow { margin-left: auto; transition: transform .25s; font-size: .7rem; }
.chapter-label.collapsed .ch-arrow { transform: rotate(-90deg); }
.chapter-tracks { overflow: hidden; transition: max-height .3s ease; }

.track-item {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 20px 12px 32px;
  cursor: pointer; transition: background .15s; position: relative;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.track-item:hover { background: rgba(154,111,32,.07); }
.track-item:active { background: rgba(154,111,32,.12); }
.track-item.active { background: rgba(154,111,32,.13); }
.track-item.active::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gold);
}
.track-num { font-family: 'Josefin Sans', sans-serif; font-size: .62rem; color: var(--muted); width: 22px; text-align: right; flex-shrink: 0; }
.track-item.active .track-num { color: var(--gold); }
.track-title { font-size: .98rem; line-height: 1.35; color: var(--text); flex: 1; min-width: 0; }
.track-item.active .track-title { color: var(--gold-light); font-weight: 600; }

.playing-indicator { display: none; gap: 2px; align-items: flex-end; height: 14px; flex-shrink: 0; }
.track-item.active.is-playing .playing-indicator { display: flex; }
.playing-indicator span { width: 3px; background: var(--gold); border-radius: 1px; animation: bounce 1s ease infinite; }
.playing-indicator span:nth-child(2) { animation-delay: .15s; }
.playing-indicator span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%,100% { height: 4px; } 50% { height: 14px; } }

/* ════════════════════════════════════════════════════════════
   SHARED READER STYLES
════════════════════════════════════════════════════════════ */
#reader::-webkit-scrollbar { width: 6px; }
#reader::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
#reader-status {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 300px; gap: 16px; color: var(--muted); font-style: italic;
}
.spinner {
  width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--gold);
  border-radius: 50%; animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#reader-content { max-width: 680px; margin: 0 auto; display: none; }
#reader-content h3 { font-size: 1.2rem; font-weight: 600; color: var(--text); margin: 1.6em 0 .4em; letter-spacing: .03em; }
#reader-content ul, #reader-content ol { margin: 1em 0 1.2em 1.5em; }
#reader-content li { font-size: 1.05rem; line-height: 1.8; margin-bottom: .4em; }
#reader-content blockquote {
  border-left: 3px solid var(--gold); margin: 1.5em 0; padding: .8em 1.4em;
  background: rgba(154,111,32,.06); font-style: italic; color: var(--gold);
}
.section-block { padding: 28px 0 32px; border-bottom: 1px solid var(--border); scroll-margin-top: 20px; }
.section-block.active-section {
  background: rgba(154,111,32,.07); border-left: 4px solid var(--gold);
  padding-left: 18px; margin-left: -18px; border-radius: 0 6px 6px 0;
}
.section-marker {
  font-family: 'Josefin Sans', sans-serif; font-size: .6rem;
  letter-spacing: .22em; color: var(--gold); text-transform: uppercase; margin-bottom: 10px; opacity: .7;
}
.section-title { font-size: 1.3rem; font-weight: 600; color: var(--gold-dark); margin: 0 0 .7em; letter-spacing: .02em; }

.corner-deco {
  position: fixed; bottom: 20px; right: 24px;
  font-family: 'Josefin Sans', sans-serif; font-size: .58rem;
  letter-spacing: .2em; color: var(--muted); opacity: .4; text-transform: uppercase; pointer-events: none;
}
.logo-mark {
  font-family: 'Josefin Sans', sans-serif; font-size: .75rem; font-weight: 600;
  letter-spacing: .35em; color: var(--gold); text-transform: uppercase; white-space: nowrap; flex-shrink: 0; line-height: 1.3;
}
</style>
</head>
<body>

<!-- ══ DESKTOP PLAYER BAR ═════════════════════════════════ -->
<div id="player-bar">
  <div class="logo-mark">AMASSED<br>Leadership</div>
  <div class="player-center">
    <div id="now-playing">Select a track — <span id="track-name-desk">nothing playing</span></div>
    <div class="player-controls">
      <button class="ctrl-btn" id="prev-btn" aria-label="Previous">&#9664;&#9664;</button>
      <button class="ctrl-btn" id="play-btn" aria-label="Play">&#9654;</button>
      <button class="ctrl-btn" id="next-btn" aria-label="Next">&#9654;&#9654;</button>
      <div class="progress-wrap">
        <span class="time-label" id="cur-time-desk">0:00</span>
        <input type="range" id="progress-desk" min="0" max="100" value="0" step="0.1" aria-label="Seek">
        <span class="time-label" id="dur-time-desk">0:00</span>
      </div>
      <div class="volume-wrap">
        <span class="vol-icon">&#128264;</span>
        <input type="range" id="volume" min="0" max="1" step="0.02" value="0.85" aria-label="Volume">
      </div>
    </div>
  </div>
</div>

<!-- ══ MOBILE HEADER ══════════════════════════════════════ -->
<div id="mobile-header">
  <button id="sidebar-toggle" aria-label="Open track list">&#9776;</button>
  <div class="mobile-now-playing">
    <span class="label">Now Playing</span>
    <span class="track-name" id="track-name-mob">Nothing selected</span>
  </div>
  <div class="mobile-logo">AMASSED<br>Leadership</div>
</div>

<!-- ══ MAIN ═══════════════════════════════════════════════ -->
<div id="sidebar-overlay" aria-hidden="true"></div>
<div id="main">
  <nav id="sidebar" aria-label="Track list">
    <div class="sidebar-head">
      <div class="sidebar-head-text">
        <h2>Contents</h2>
        <p>Five chapters · 64 tracks</p>
      </div>
      <button id="sidebar-close" aria-label="Close">&#10005;</button>
    </div>
    <div id="track-list"></div>
    <div style="padding:14px 20px;border-top:1px solid var(--border);flex-shrink:0;">
      <a href="leadership-database.html" style="display:block;font-family:'Josefin Sans',sans-serif;font-size:.63rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);text-decoration:none;padding:8px 12px;border:1px solid var(--border);border-radius:6px;text-align:center;transition:background .2s;" onmouseover="this.style.background='rgba(154,111,32,.08)'" onmouseout="this.style.background=''">Leadership Traits Database</a>
    </div>
  </nav>
  <section id="reader" aria-label="Reader content">
    <div id="reader-status"><div class="spinner"></div><span>Loading ebook content…</span></div>
    <div id="reader-content"></div>
  </section>
</div>

<!-- ══ MOBILE BOTTOM PLAYER ═══════════════════════════════ -->
<div id="mobile-player">
  <div class="mob-progress-row">
    <span class="mob-time" id="cur-time-mob">0:00</span>
    <input type="range" id="progress-mob" min="0" max="100" value="0" step="0.1" aria-label="Seek">
    <span class="mob-time" id="dur-time-mob">0:00</span>
  </div>
  <div class="mob-controls-row">
    <button class="ctrl-btn" id="prev-btn-mob" aria-label="Previous">&#9664;&#9664;</button>
    <button class="ctrl-btn" id="play-btn" aria-label="Play">&#9654;</button>
    <button class="ctrl-btn" id="next-btn-mob" aria-label="Next">&#9654;&#9654;</button>
  </div>
</div>

<div class="corner-deco" aria-hidden="true">AMASSED · Leadership Reader</div>
<audio id="audio-el" preload="none"></audio>

<script>
const R2_BASE   = 'https://pub-4620c72145cc48908b01ffb63756072a.r2.dev/audio';
const EBOOK_URL = 'https://raw.githubusercontent.com/drd1201/amassed-course-app/main/Home1.html';
const TOTAL_TRACKS = 64;
const CHAPTERS = [
  { title: 'Introduction', from: 0,  to: 12 },
  { title: 'Chapter 2',    from: 13, to: 25 },
  { title: 'Chapter 3',    from: 26, to: 38 },
  { title: 'Chapter 4',    from: 39, to: 51 },
  { title: 'Chapter 5',    from: 52, to: 63 },
];
function pad(n) { return String(n).padStart(2,'0'); }
function fmt(s) { if(!s||isNaN(s))return'0:00'; return`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`; }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const tracks = Array.from({length:TOTAL_TRACKS},(_,i)=>({
  index:i, file:`${R2_BASE}/${pad(i)}.mp3`, title:`Section ${pad(i)}`, sectionId:`sec-${pad(i)}`
}));

// Elements
const audio      = document.getElementById('audio-el');
const playBtnD   = document.getElementById('play-btn');    // shared id on desktop bar
const prevBtnD   = document.getElementById('prev-btn');
const nextBtnD   = document.getElementById('next-btn');
const progD      = document.getElementById('progress-desk');
const curD       = document.getElementById('cur-time-desk');
const durD       = document.getElementById('dur-time-desk');
const volEl      = document.getElementById('volume');
const nameD      = document.getElementById('track-name-desk');
const prevBtnM   = document.getElementById('prev-btn-mob');
const nextBtnM   = document.getElementById('next-btn-mob');
const progM      = document.getElementById('progress-mob');
const curM       = document.getElementById('cur-time-mob');
const durM       = document.getElementById('dur-time-mob');
const nameM      = document.getElementById('track-name-mob');
const sidebarEl  = document.getElementById('sidebar');
const overlay    = document.getElementById('sidebar-overlay');
const togBtn     = document.getElementById('sidebar-toggle');
const closeBtn   = document.getElementById('sidebar-close');
const trackListEl= document.getElementById('track-list');
const statusEl   = document.getElementById('reader-status');
const contentEl  = document.getElementById('reader-content');

// Note: play-btn appears in BOTH player bars in the HTML but with same id.
// On mobile the desktop bar is hidden so only mobile play btn is visible.
// We wire click on all elements with class ctrl-btn[aria-label=Play] via the shared id.
// Actually we have two separate play buttons for desktop vs mobile.
// Fix: grab all play buttons by querying both bars.
const allPlayBtns = document.querySelectorAll('#play-btn');

let cur = -1;
audio.volume = parseFloat(volEl.value);

function isMobile(){ return window.innerWidth <= 700; }

function openSidebar(){ sidebarEl.classList.add('open'); overlay.classList.add('visible'); }
function closeSidebar(){ sidebarEl.classList.remove('open'); overlay.classList.remove('visible'); }
togBtn.addEventListener('click', openSidebar);
closeBtn.addEventListener('click', closeSidebar);
overlay.addEventListener('click', closeSidebar);

function setPlayUI(playing){
  const icon = playing ? '&#9646;&#9646;' : '&#9654;';
  allPlayBtns.forEach(b=>{ b.innerHTML=icon; b.setAttribute('aria-label', playing?'Pause':'Play'); });
  if(cur>=0) setDot(cur, playing);
}

function loadTrack(idx, autoplay=true){
  if(idx<0||idx>=TOTAL_TRACKS) return;
  const prev=cur; cur=idx;
  const t=tracks[idx];
  audio.pause(); audio.src=''; audio.src=t.file; audio.load();
  nameD.textContent=t.title; nameM.textContent=t.title;
  updateActive(prev,idx);
  scrollToActive();
  showSection(t.sectionId);
  if(isMobile()) closeSidebar();
  if(autoplay){ audio.play().then(()=>setPlayUI(true)).catch(()=>setPlayUI(false)); }
}

function togglePlay(){
  if(cur<0){ loadTrack(0); return; }
  if(audio.paused){ audio.play().then(()=>setPlayUI(true)).catch(()=>setPlayUI(false)); }
  else { audio.pause(); setPlayUI(false); }
}

function fillSlider(el, pct){
  el.style.background=`linear-gradient(to right,var(--gold) 0%,var(--gold) ${pct}%,var(--bg3) ${pct}%,var(--bg3) 100%)`;
}

audio.addEventListener('timeupdate',()=>{
  if(!audio.duration) return;
  const pct=(audio.currentTime/audio.duration)*100;
  progD.value=pct; progM.value=pct;
  const c=fmt(audio.currentTime), d=fmt(audio.duration);
  curD.textContent=c; durD.textContent=d; curM.textContent=c; durM.textContent=d;
  fillSlider(progD,pct); fillSlider(progM,pct);
});
audio.addEventListener('ended',()=>{ setPlayUI(false); if(cur+1<TOTAL_TRACKS) loadTrack(cur+1); });
audio.addEventListener('error',()=>setPlayUI(false));

[progD,progM].forEach(el=>{
  el.addEventListener('input',()=>{
    if(audio.duration){ audio.currentTime=(el.value/100)*audio.duration; fillSlider(progD,el.value); fillSlider(progM,el.value); }
  });
});
volEl.addEventListener('input',()=>{ audio.volume=parseFloat(volEl.value); fillSlider(volEl,parseFloat(volEl.value)*100); });
fillSlider(volEl, parseFloat(volEl.value)*100);

allPlayBtns.forEach(b=>b.addEventListener('click',togglePlay));
prevBtnD.addEventListener('click',()=>loadTrack(cur-1));
nextBtnD.addEventListener('click',()=>loadTrack(cur+1));
prevBtnM.addEventListener('click',()=>loadTrack(cur-1));
nextBtnM.addEventListener('click',()=>loadTrack(cur+1));

// Ebook
async function loadEbook(){
  try{
    const res=await fetch(EBOOK_URL);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const raw=await res.text();
    const plain=raw.replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ');
    parseAndRender(plain);
    statusEl.style.display='none'; contentEl.style.display='block';
    buildSidebar();
  }catch(err){
    statusEl.innerHTML=`<p style="color:var(--muted);font-style:italic;text-align:center;max-width:360px;line-height:1.7">
      Could not load ebook from GitHub.<br><small>${err.message}</small><br><br>
      Ensure the repo is <em>public</em> and <code>Home1.html</code> is on <code>main</code>.</p>`;
  }
}

function parseAndRender(text){
  const re=/\[(\d{2})\]/g; let lastIdx=0,lastNum=null,match; const segs=[];
  while((match=re.exec(text))!==null){
    if(lastNum!==null) segs.push({num:lastNum,body:text.slice(lastIdx,match.index).trim()});
    lastNum=parseInt(match[1],10); lastIdx=match.index+match[0].length;
  }
  if(lastNum!==null) segs.push({num:lastNum,body:text.slice(lastIdx).trim()});
  if(!segs.length){ contentEl.innerHTML=`<p>${text.replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>')}</p>`; return; }
  let html='';
  segs.forEach(seg=>{
    const ns=pad(seg.num), lines=seg.body.split('\n').map(l=>l.trim()).filter(Boolean);
    const title=lines[0]||`Section ${ns}`;
    if(tracks[seg.num]) tracks[seg.num].title=title;
    const body=lines.map((l,i)=>i===0?`<h3 class="section-title">${esc(l)}</h3>`:`<p>${esc(l)}</p>`).join('');
    html+=`<div class="section-block" id="sec-${ns}" data-track="${seg.num}"><div class="section-marker">[${ns}]→[${pad(seg.num+1)}]</div>${body}</div>`;
  });
  contentEl.innerHTML=html;
}

function showSection(id){
  contentEl.querySelectorAll('.active-section').forEach(el=>el.classList.remove('active-section'));
  const el=document.getElementById(id); if(!el) return;
  el.classList.add('active-section'); el.scrollIntoView({behavior:'smooth',block:'start'});
}

function buildSidebar(){
  trackListEl.innerHTML='';
  CHAPTERS.forEach((ch,ci)=>{
    const group=document.createElement('div');
    const label=document.createElement('div'); label.className='chapter-label';
    label.innerHTML=`<span class="ch-num">${ci+1}</span><span>${ch.title}</span><span class="ch-arrow">&#9660;</span>`;
    const wrap=document.createElement('div'); wrap.className='chapter-tracks';
    label.addEventListener('click',()=>{ const c=label.classList.toggle('collapsed'); wrap.style.maxHeight=c?'0':wrap.scrollHeight+'px'; });
    for(let i=ch.from;i<=ch.to;i++){
      const t=tracks[i], item=document.createElement('div');
      item.className='track-item'; item.dataset.idx=i;
      item.setAttribute('role','button'); item.setAttribute('tabindex','0');
      item.innerHTML=`<span class="track-num">${pad(i)}</span><span class="track-title">${esc(t.title)}</span><div class="playing-indicator" aria-hidden="true"><span></span><span></span><span></span></div>`;
      item.addEventListener('click',()=>loadTrack(i));
      item.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ') loadTrack(i); });
      wrap.appendChild(item);
    }
    group.appendChild(label); group.appendChild(wrap); trackListEl.appendChild(group);
    requestAnimationFrame(()=>{ wrap.style.maxHeight=wrap.scrollHeight+'px'; });
  });
}

function updateActive(prev,next){
  if(prev>=0){ const el=trackListEl.querySelector(`[data-idx="${prev}"]`); if(el) el.classList.remove('active','is-playing'); }
  const el=trackListEl.querySelector(`[data-idx="${next}"]`); if(el) el.classList.add('active');
}
function setDot(idx,on){ const el=trackListEl.querySelector(`[data-idx="${idx}"]`); if(!el) return; on?el.classList.add('is-playing'):el.classList.remove('is-playing'); }
function scrollToActive(){ const el=trackListEl.querySelector('.active'); if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'}); }

buildSidebar();
loadEbook();
</script>
</body>
</html>
