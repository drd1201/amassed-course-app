<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMASSED | Strategic Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #fff; margin: 0; overflow: hidden; }
        h1 { font-family: 'Playfair Display', serif; }
        .sidebar { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border-right: 1px solid rgba(255,255,255,0.1); }
        .content-area { background: #ffffff; color: #1a1a1a; }
        .chapter-btn { transition: all 0.2s; border: 1px solid rgba(255,255,255,0.1); }
        .chapter-btn:hover { border-color: #f97316; background: rgba(249, 115, 22, 0.1); }
        .audio-sticky { position: sticky; top: 0; background: #f3f4f6; border-bottom: 3px solid #f97316; z-index: 50; }
    </style>
</head>
<body>

    <div class="flex h-screen">
        <aside class="sidebar w-1/3 h-full overflow-y-auto p-6">
            <h2 class="text-orange-500 font-black tracking-widest text-xs mb-8 uppercase">Amassed Curriculum</h2>
            
            <div class="space-y-3">
                <button onclick="loadSession('00', 'The Introduction')" class="chapter-btn w-full text-left p-4 rounded-xl flex justify-between items-center bg-white/5">
                    <div>
                        <div class="text-xs text-orange-500 font-bold">START</div>
                        <div class="font-bold">The Introduction</div>
                    </div>
                    <span class="text-orange-500 text-xl">▶</span>
                </button>

                <button onclick="loadSession('01', 'Session 01: Foundations')" class="chapter-btn w-full text-left p-4 rounded-xl flex justify-between items-center bg-white/5">
                    <div>
                        <div class="text-xs text-orange-500 font-bold">SESSION 01</div>
                        <div class="font-bold">The Strategic Walk</div>
                    </div>
                    <span class="text-orange-500 text-xl">▶</span>
                </button>

                </div>
        </aside>

        <main class="content-area w-2/3 h-full flex flex-col">
            <div id="player-container" class="hidden audio-sticky p-4 flex items-center gap-4">
                <div class="text-xs font-black text-orange-600 uppercase w-24 leading-tight" id="playing-title">Intro</div>
                <audio id="audio-player" controls class="flex-grow h-10 accent-orange-600">
                    <source src="" type="audio/mpeg">
                </audio>
            </div>

            <div class="flex-grow overflow-y-auto p-12 md:p-20" id="text-frame">
                <div id="welcome-msg" class="h-full flex flex-col justify-center items-center text-center opacity-50">
                    <h1 class="text-5xl mb-4">AMASSED</h1>
                    <p class="text-xl italic">Select a session from the menu to begin.</p>
                </div>
                <div id="active-text" class="max-w-2xl mx-auto hidden transition-opacity duration-500">
                    </div>
            </div>
        </main>
    </div>

    <script>
        const r2Url = "https://pub-4620c72145cc48908b01ffb63756072a.r2.dev/";

        // PASTE YOUR TEXT FROM Home1.txt INSIDE THE BACKTICKS BELOW
        const sessionData = {
            "00": `[YOUR INTRODUCTION TEXT FROM HOME1.TXT]`,
            "01": `[YOUR SESSION 1 TEXT FROM HOME1.TXT]`
        };

        function loadSession(id, title) {
            const player = document.getElementById('audio-player');
            const container = document.getElementById('player-container');
            const welcome = document.getElementById('welcome-msg');
            const textDiv = document.getElementById('active-text');
            const titleDisplay = document.getElementById('playing-title');

            // Set Audio
            player.src = r2Url + id + ".mp3";
            titleDisplay.innerText = title;
            
            // Set Text
            textDiv.innerHTML = `<h1 class="text-4xl font-black mb-8 border-b-4 border-orange-500 pb-4 inline-block">${title}</h1>
                                 <div class="text-xl leading-loose space-y-6">${sessionData[id] || "Content is currently being uploaded."}</div>`;

            // Reveal UI
            welcome.classList.add('hidden');
            container.classList.remove('hidden');
            textDiv.classList.remove('hidden');
            
            player.play();
            document.getElementById('text-frame').scrollTop = 0;
        }
    </script>
</body>
</html>
